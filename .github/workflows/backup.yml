name: daily-backup

# Fetch every site config from data.parroquia.app and commit any changes.
# Runs daily on a schedule; can also be triggered manually.
on:
  schedule:
    # 03:17 UTC, daily.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run backup
        run: node scripts/backup.mjs

      - name: Commit changes
        run: |
          git config user.name "parroquia-backup-bot"
          git config user.email "parroquia-backup-bot@users.noreply.github.com"
          git add config/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "backup: $(date -u +%Y-%m-%d)"
            git push
          fi
